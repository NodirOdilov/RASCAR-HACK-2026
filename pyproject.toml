[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rascar"
version = "1.0.0"
description = "RASCAR.HACK 2026 Case 1 - Detector Error Discovery (team Evolyutsiya)"
requires-python = ">=3.11"
# Exact versions of the verified execution environment are pinned in requirements.txt.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "lightgbm>=4.3",
    "catboost>=1.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
